<html lang="en">

    <meta charset="UTF-8">

    <title>ARKLegendsPVE Admin Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --cyan: #00ffff; --purple: #bc13fe; --gold: #ffd700; --black: #050505; --blue: #1E90FF; --green: #00ff00; --pink: #ff69b4;
            --color-island: #00ff00; --color-scorched: #ff9900; --color-center: #00ccff; --color-aberration: #ff00ff;
            --color-extinction: #ff3300; --color-ragnarok: #00ffcc; --color-valguero: #ffffff;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--black); color: #e6e6e6; background-image: radial-gradient(circle at 50% 50%, #1a0033 0%, #050505 100%); min-height: 100vh; padding: 20px 0; }
        h1, h2 { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
        
        .cyber-card { 
            max-width: 900px; margin: 1rem auto; padding: 2rem; 
            background: rgba(10, 10, 10, 0.9); border: 2px solid var(--purple); 
            border-radius: 15px; box-shadow: 0 0 15px rgba(188, 19, 254, 0.3);
            position: relative;
        }

        .tab-container { display: flex; justify-content: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 2rem; flex-wrap: wrap; }
        .tab-btn { padding: 10px 15px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.75rem; transition: 0.3s; color: #666; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--cyan); border-bottom: 2px solid var(--cyan); text-shadow: 0 0 8px var(--cyan); }

        .input-label { color: var(--gold); font-family: 'Orbitron', sans-serif; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.5rem; display: block; }
        .input-style { background: rgba(20, 20, 20, 0.9); border: 1px solid #333; color: var(--cyan); border-radius: 4px; padding: 0.75rem; width: 100%; transition: 0.3s; }
        .input-style:focus { border-color: var(--cyan); outline: none; }

        .dropdown-content { 
            display: none; position: absolute; background: #0a0a0a; width: 100%; 
            max-height: 400px; overflow-y: auto; border: 1px solid var(--purple); 
            border-radius: 8px; z-index: 9999; margin-top: 4px; 
        }
        .cat-header { padding: 12px 15px; font-weight: bold; background: #111; cursor: pointer; font-family: 'Orbitron'; font-size: 0.75rem; display: flex; justify: space-between; border-bottom: 1px solid #1a1a1a; }
        .cat-items li { padding: 10px 25px; cursor: pointer; border-bottom: 1px solid #111; transition: 0.2s; font-size: 0.9rem; list-style: none; }
        .cat-items li:hover { background: rgba(255, 255, 255, 0.05); padding-left: 30px; }

        .command-box { background: #000; border: 1px solid var(--cyan); color: #fff; padding: 1rem; border-radius: 5px; font-family: 'Courier New', monospace; min-height: 60px; border-left: 4px solid var(--cyan); word-break: break-all; white-space: pre-wrap; }
        .action-btn { background: linear-gradient(45deg, var(--purple), var(--cyan)); color: white; font-family: 'Orbitron'; font-weight: bold; width: 100%; padding: 1.2rem; border-radius: 8px; margin-top: 1.5rem; transition: 0.3s; text-transform: uppercase; cursor: pointer; border: none; }
        .btn-reset { background: var(--pink); color: white; }

        .gender-btn { flex: 1; text-align: center; padding: 0.75rem; border: 1px solid #333; background: #111; cursor: pointer; transition: 0.3s; font-family: 'Orbitron'; font-size: 0.8rem; }
        #f:checked + label { background: #FF0099; color: white; box-shadow: 0 0 15px #FF0099; }
        #m:checked + label { background: var(--blue); color: white; box-shadow: 0 0 15px var(--blue); }

        /* Map optgroup coloring */
        optgroup[label="The Island"] { color: var(--color-island); }
        optgroup[label="Scorched Earth"] { color: var(--color-scorched); }
        optgroup[label="The Center"] { color: var(--color-center); }
        optgroup[label="Aberration"] { color: var(--color-aberration); }
        optgroup[label="Extinction"] { color: var(--color-extinction); }
        optgroup[label="Ragnarök"] { color: var(--color-ragnarok); }
        optgroup[label="Valguero"] { color: var(--color-valguero); }

 /* CREATURE COLORS */
        .c-isl { color: #00FF00 !important; } /* The Island: Green */
        .c-sva { color: #1E90FF !important; } /* S-Variants: Blue */
        .c-mar { color: #ADD8E6 !important; } /* Aquatic: Light Blue */
        .c-sco { color: #FFFF00 !important; } /* Scorched Earth: Yellow */
        .c-abe { color: #bc13fe !important; } /* Aberration: Purple */
        .c-ext { color: #00FFFF !important; } /* Extinction: Cyan */
        .c-dra { color: #FF0000 !important; } /* Draconic: Red */
        .c-ast { color: #008080 !important; } /* Astraeos: Teal */
        .c-col { color: #ff69b4 !important; } /* Lost Colony: Bright Pink */
        .c-mod { color: #ffffff !important; } /* Modded: White */
        .hidden { display: none !important; }
    </style>
</head>

        </div>

        <div id="pane-creature">

            <div class="mb-6"><label class="input-label">Creature Search:</label><input type="text" id="cSearch" oninput="filterC(this.value)" class="input-style" placeholder="Search Database..."></div>
            <div class="mb-6 relative">
                <label class="input-label">Select Creature:</label>
                <div id="cBox" class="input-style flex justify-between items-center cursor-pointer" onclick="toggleD('cList')">
                    <span id="cText">--- Awaiting Selection ---</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2"></path></svg>
                </div>
                <div id="cList" class="dropdown-content"><div id="cItems"></div></div>
            </div>
            <div class="mb-8"><label class="input-label">Biological Gender:</label><div class="flex gap-2">
                <input type="radio" id="f" name="g" value="1" checked class="hidden"><label for="f" class="gender-btn rounded-l-lg">♀ FEMALE</label>
                <input type="radio" id="m" name="g" value="0" class="hidden"><label for="m" class="gender-btn rounded-r-lg">♂ MALE</label>
            </div></div>
        </div>

        <div id="pane-saddle" class="hidden">
            <div class="mb-6"><label class="input-label">Saddle Search:</label><input type="text" oninput="filterS(this.value)" class="input-style" placeholder="Search Saddles..."></div>
            <div class="mb-6"><label class="input-label">Select Saddle:</label><select id="saddleSelector" class="input-style"></select></div>
            <div class="grid grid-cols-3 gap-4 mb-6 p-4 bg-white/5 rounded-lg border border-white/10">
                <div class="text-center font-bold text-cyan-400">QTY: 1</div>
                <div class="text-center font-bold text-cyan-400">QUAL: 100</div>
                <div class="flex justify-center items-center gap-2">
                    <input type="checkbox" id="isBP" class="w-4 h-4 accent-cyan-400"><label for="isBP" class="text-xs font-bold text-yellow-400">AS BP</label>
                </div>
            </div>
        </div>

        <div id="pane-bp" class="hidden">
            <div class="mb-6"><label class="input-label">Quest Selection</label><select id="questSelect" class="input-style"></select></div>
            <div class="mb-6"><label class="input-label">Reset Reward Type</label><select id="rewardType" class="input-style"><option value="Free">Free</option><option value="Premium">Premium</option></select></div>
        </div>

        <div id="pane-perm" class="hidden">
            <div class="mb-6"><label class="input-label">Action</label>
                <select id="permCmd" class="input-style" onchange="togglePermInputs()">
                    <option value="add">Add Permanent Group</option><option value="remove">Remove Group</option>
                    <option value="addtimed">Add Timed Group</option><option value="removetimed">Remove Timed Group</option>
                    <option value="list">List Player Groups</option><option value="reload">Reload Permissions</option>
                </select>
            </div>
            <div class="mb-6" id="groupSelectBox"><label class="input-label">Select Group</label><select id="groupName" class="input-style"></select></div>
            <div id="timedBox" class="hidden grid grid-cols-2 gap-4 mb-6">
                <div><label class="input-label">Duration (Days)</label><input type="number" id="days" value="1" class="input-style"></div>
 <div><label class="input-label">Delay (Hours)</label><input type="number" id="delay" value="0" class="input-style"></div>
            </div>
        </div>

        <div class="flex gap-4">

        </div>

let suiteMode = 'creature';
let selP = "", selN = "";

function setSuiteMode(m) {
    suiteMode = m;
    ['tab-c', 'tab-s', 'tab-bp', 'tab-perm'].forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById(`tab-${m === 'creature' ? 'c' : m === 'saddle' ? 's' : m}`).classList.add('active');
    
    ['pane-creature', 'pane-saddle', 'pane-bp', 'pane-perm'].forEach(p => document.getElementById(p).classList.add('hidden'));
    document.getElementById(`pane-${m}`).classList.remove('hidden');

    document.getElementById('resetBtn').classList.toggle('hidden', m !== 'bp');
    document.getElementById('idLabel').textContent = (m === 'saddle') ? "Target Player Implant Number:" : "Target Player EOS ID Number:";
    
    // --- NEW BUTTON TEXT LOGIC ---
    const mainBtn = document.getElementById('mainBtn');
    if (m === 'bp') {
        mainBtn.textContent = "ADD PROGRESS";
    } else {
        mainBtn.textContent = "GENERATE COMMAND";
    }
    // -----------------------------

    togglePermInputs();
}

function toggleD(id) { 
    const e = document.getElementById(id); 
    e.style.display = e.style.display === 'block' ? 'none' : 'block'; 
}

function filterC(v) {
    const low = v.toLowerCase();
    const list = document.getElementById('cList');
    const categories = document.querySelectorAll('#cItems > div');
    
    // Auto-show list when typing
    list.style.display = v.trim() !== "" ? 'block' : 'none';

    categories.forEach(cat => {
        const items = cat.querySelectorAll('li');
        let hasMatch = false;
        items.forEach(li => {
            if (li.textContent.toLowerCase().includes(low)) {
                li.style.display = 'block';
                hasMatch = true;
            } else {
                li.style.display = 'none';
            }
        });
        // Hides the map header if no dinos match
        cat.style.display = hasMatch ? 'block' : 'none';
    });
}

function filterS(v) {
    const low = v.toLowerCase();
    const sel = document.getElementById('saddleSelector');
    // Fixes the "undefined" error by using correct data keys
    sel.innerHTML = SADDLES
        .filter(x => x.name.toLowerCase().includes(low))
        .map(x => `<option value="${x.path}">${x.name}</option>`)
        .join('');
}

function togglePermInputs() {
    if(suiteMode !== 'perm') return;
    const cmd = document.getElementById('permCmd').value;
    document.getElementById('groupSelectBox').classList.toggle('hidden', cmd === 'reload' || cmd === 'list');
    document.getElementById('timedBox').classList.toggle('hidden', cmd !== 'addtimed');
    document.getElementById('idInputGroup').classList.toggle('hidden', cmd === 'reload');
}

async function executeSuite() {
    const id = document.getElementById('masterId').value.trim();
    const permType = document.getElementById('permCmd').value;
    
    // Allow 'reload' to run without an ID
    if(!id && !(suiteMode === 'perm' && permType === 'reload')) {
        return alert("ID Required");
    }

    let cmd = "", log = null;

    if(suiteMode === 'creature') {
        if(!selP) return alert("Select Creature");
        const g = document.querySelector('input[name="g"]:checked').value;
        const note = document.getElementById('staffNote').value || "No note";
        cmd = `Scriptcommand SpawnDinoInBall -p=${id} -t=${selP} -f=${g} -b=1 -i=1 -a=1 -s=255,255,255,255,255,255,255,255`;
        log = {title: "Creature Log", fields: [{name:"ID", value:id, inline:true}, {name:"Dino", value:selN, inline:true}, {name:"Note", value:note}], color: 43519};
    } 
    else if(suiteMode === 'saddle') {
        const saddleP = document.getElementById('saddleSelector').value;
        if(!saddleP) return alert("Select a Saddle first");
        const isBP = document.getElementById('isBP').checked ? 1 : 0;
        cmd = `giveitemtoplayer ${id} ${saddleP} 1 100 ${isBP}`;
    }
    else if(suiteMode === 'bp') {
        const questVal = document.getElementById('questSelect').value;
        if(!questVal) return alert("Select a Quest");
        cmd = questVal.split('|').map(v => `BattlePass.AddProgress ${id} ${v}`).join('\n');
    }
    else if(suiteMode === 'perm') {
        const grp = document.getElementById('groupName').value;
        const delay = document.getElementById('delay').value;
        
        if(permType === 'add') {
            cmd = `Permissions.Add ${id} ${grp}`;
        } else if(permType === 'remove') {
            cmd = `Permissions.Remove ${id} ${grp}`;
        } else if(permType === 'addtimed') {
            // Converts Days input into Hours (Day * 24)
            const dayVal = document.getElementById('days').value;
            const totalHours = dayVal * 24;
            cmd = `Permissions.AddTimed ${id} ${grp} ${totalHours} ${delay}`;
        } else if(permType === 'removetimed') {
            cmd = `Permissions.RemoveTimed ${id} ${grp}`;
        } else if(permType === 'list') {
            cmd = `Permissions.PlayerGroups ${id}`;
        } else if(permType === 'reload') {
            cmd = `Permissions.reload`;
        }
}

    updateOutput(cmd);
    if(log) sendLog(log);
}

function executeBPReset() {
    const id = document.getElementById('masterId').value.trim();
    if(!id) return alert("ID Required");
    const sel = document.getElementById('questSelect');
    const qName = sel.options[sel.selectedIndex].dataset.name;
    const rew = document.getElementById('rewardType').value;
    updateOutput(`BattlePass.ResetQuestRewards ${id} ${qName} ${rew}`);
}

function updateOutput(cmd) {
    document.getElementById('oBox').textContent = cmd;
    navigator.clipboard.writeText(cmd);
    const st = document.getElementById('status'); 
    st.textContent = "✅ COMMAND COPIED"; 
    st.style.opacity = "1";
    setTimeout(() => st.style.opacity = "0", 2500);
}

async function sendLog(log) {
    try { await fetch(WH_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({embeds:[{...log, timestamp:new Date()}]})}); } catch(e){}
}

window.onload = () => {
    // 1. Fill Creatures with Map-Specific Colors
    const cCont = document.getElementById('cItems');
    
    // Mapping your requested colors to the category names
    const mapColors = {
        "The Island": "#00FF00",           // Green
        "S-Variants": "#1E90FF",           // Blue
        "Aquatic": "#ADD8E6",              // Light Blue
        "Scorched Earth": "#FFFF00",       // Yellow
        "Aberration": "#bc13fe",           // Purple
        "Extinction": "#00FFFF",           // Cyan
        "Draconic Chronicles": "#FF0000",  // Red
        "Astraeos Additions": "#008080",   // Teal
        "Lost Colony": "#ff69b4",          // Bright Pink
        "Modded": "#ffffff"                // White
    };

    Object.keys(CREATURES).forEach(cat => {
        const div = document.createElement('div');
        const headerColor = mapColors[cat] || "#ffffff"; // Default to white if map name doesn't match
        
        div.innerHTML = `
            <div class="cat-header" style="color: ${headerColor}; border-bottom: 1px solid ${headerColor}44;" onclick="this.nextElementSibling.classList.toggle('hidden')">
                --- ${cat} ---
            </div>
            <ul class="cat-items hidden"></ul>`;
            
        CREATURES[cat].forEach(d => {
            const li = document.createElement('li'); 
            li.className = d.c; 
            li.textContent = d.n;
            li.onclick = (e) => { 
                e.stopPropagation(); 
                selP = d.p; 
                selN = d.n; 
                const cDisplay = document.getElementById('cText');
                cDisplay.textContent = d.n; 
                cDisplay.style.color = headerColor; // Changes the selected text color to match the map
                document.getElementById('cList').style.display = 'none'; 
            };
            div.querySelector('ul').appendChild(li);
        });
        cCont.appendChild(div);
    });

// 2. Fill Saddles
document.getElementById('saddleSelector').innerHTML = SADDLES.map(s => `<option value="${s.path}">${s.name}</option>`).join('');
    
    // 3. Fill BP (Battle Pass)
    const qSel = document.getElementById('questSelect');
    QUESTS.forEach(c => {
        const g = document.createElement('optgroup'); 
        g.label = c.cat;
        c.items.forEach(q => { 
            const o = document.createElement('option'); 
            o.value = q.v; 
            o.textContent = q.n; 
            o.dataset.name = q.d; 
            g.appendChild(o); 
        });
        qSel.appendChild(g);
    });

    // 4. Fill Perms (Permissions)
    document.getElementById('groupName').innerHTML = GROUPS.map(g => `<option value="${g}">${g}</option>`).join('');
};
